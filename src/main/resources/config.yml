generation:
  template-patterns:
    - templates/*.yml
  start-piece: root
  world: world
  origin:
    x: 0
    y: 64
    z: 0
  seed: 123456789
  algorithm:
    max-depth: 8
    branch-chance: 0.45
    entrance-branch-bonus: 0.15
    depth-prediction-multiplier: 1.0
    min-piece-count: 12
    max-piece-count: 24
door:
  enabled: true
  chance: 0.35
  material: SPRUCE_DOOR
debug:
  enabled: false
enemies:
  enabled: false
  mode: reserved
azirouge:
  mob-spawn-interval-seconds: 30
  mob-spawn-count-per-interval: 3
  chest:
    base-spawn-chance: 0.1
    depth-multiplier: 0.05
    max-spawn-chance: 0.9
