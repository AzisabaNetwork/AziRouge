join:
  isbeta: false
generation:
  template-preset: test
  template-patterns:
    - templates/test.yml
  start-piece: root
  world: world
  origin:
    x: 0
    y: 64
    z: 0
  seed: 123456789
  algorithm:
    max-depth: 12
    branch-chance: 0.25
    entrance-branch-bonus: 0.05
    depth-prediction-multiplier: 1.3
    min-pieces-per-depth: 4
    max-pieces-per-depth: 8
    adjacent-piece-penalty: 3.0
door:
  enabled: true
  chance: 0.75
  material: SPRUCE_DOOR
debug:
  enabled: false
database:
  # MariaDB/MySQL persistence. Keep disabled until valid credentials are configured.
  enabled: false
  host: 127.0.0.1
  port: 3306
  name: azirouge
  username: azirouge
  password: "change-me"
  use-ssl: false
  maximum-pool-size: 4
  connection-timeout-millis: 5000
leaderboard:
  # Enable after database.enabled is configured successfully.
  enabled: false
  # Calendar periods use this timezone; timestamps are stored in UTC.
  timezone: Asia/Tokyo
  top-size: 10
  update-interval-seconds: 60
  displays:
    daily:
      world: world
      x: 0.5
      y: 76.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
      title: 日間ランキング
    weekly:
      world: world
      x: 0.5
      y: 72.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
      title: 週間ランキング
    monthly:
      world: world
      x: 0.5
      y: 68.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
      title: 月間ランキング
    total:
      world: world
      x: 0.5
      y: 64.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
      title: 通算ランキング
sessions:
  default-max-players: 4
  max-max-players: 8
  idle-timeout-seconds: 60
  world-name-prefix: azirouge-
  home-template-world-path: azirouge
  cleanup-leftover-worlds-on-startup: true
home:
  spawn:
    x: 0
    y: 64
    z: 0
  return-spawn:
    x: 0
    y: 56
    z: 23
  area:
    min:
      x: -16
      y: 0
      z: -16
    max:
      x: 64
      y: 255
      z: 64
dungeon:
  base-distance-from-home: 512
  round-spacing: 512
  default-max-depth: 6
journey:
  enabled: true
  # Height above the top of each entrance area; adjust to the home template.
  entrance-height: 1.2
  view-distance: 16
round-timing:
  # A Minecraft day is 24000 ticks (0 = 06:00, 6000 = 12:00, 12000 = 18:00, 18000 = 00:00).
  # Time is paused only on day 0, until the first dungeon departure.
  start-time-ticks: 0
  deadline-time-ticks: 18000
  sleep:
    # Skip immediately at 100%; otherwise this percentage must sleep for wait-seconds.
    minimum-percentage: 50
    wait-seconds: 5
portals:
  home-to-dungeon:
    area:
      min:
        x: -1
        y: 50
        z: 25
      max:
        x: 2
        y: 53
        z: 28
    destination-offset:
      x: 4
      y: 1
      z: 20
      yaw: 180.0
  dungeon-to-home:
    area:
      min:
        x: 3
        y: 6
        z: 24
      max:
        x: 5
        y: 9
        z: 30
    destination-yaw-offset: 180.0
  cooldown-seconds: 3
economy:
  initial-balance: 300
  quota:
    base: 50
    per-round: 25
    multiplier: 1.1
    # N: the game ends after this many consecutive quota misses.
    max-consecutive-misses: 3
    warning-remaining: 1
    # A delivery chest is created here in every session world.
    delivery-chest:
      x: 2
      y: 64
      z: 0
  sell-prices:
    COAL: 3
    IRON_NUGGET: 5
    COPPER_NUGGET: 5
    RAW_IRON: 10
    IRON_INGOT: 10
    GOLD_NUGGET: 5
