generation:
  template-patterns:
    - templates/*.yml
  start-piece: root
  world: world
  origin:
    x: 0
    y: 64
    z: 0
  seed: 123456789
  algorithm:
    max-depth: 8
    branch-chance: 0.25
    entrance-branch-bonus: 0.05
    depth-prediction-multiplier: 1.0
    min-pieces-per-depth: 2
    max-pieces-per-depth: 4
    adjacent-piece-penalty: 2.0
door:
  enabled: true
  chance: 0.35
  material: SPRUCE_DOOR
debug:
  enabled: false
sessions:
  default-max-players: 4
  max-max-players: 8
  idle-timeout-seconds: 60
  world-name-prefix: azirouge_
  home-template-world-path: azirouge_home_template
  cleanup-leftover-worlds-on-startup: true
home:
  spawn:
    x: 0
    y: 64
    z: 0
  return-spawn:
    x: 0
    y: 64
    z: -4
  area:
    min:
      x: -16
      y: 0
      z: -16
    max:
      x: 16
      y: 255
      z: 16
dungeon:
  base-distance-from-home: 512
  round-spacing: 512
  default-max-depth: 8
portals:
  home-to-dungeon:
    area:
      min:
        x: -1
        y: 64
        z: 2
      max:
        x: 1
        y: 64
        z: 2
    destination-offset:
      x: 0
      y: 64
      z: 3
      yaw: 0.0
  dungeon-to-home:
    area:
      min:
        x: -1
        y: 64
        z: -1
      max:
        x: 1
        y: 66
        z: 1
    destination-yaw-offset: 0.0
  cooldown-seconds: 3
economy:
  initial-balance: 100
  maintenance:
    base: 10
    per-round: 5
    multiplier: 1.0
  sell-prices:
    IRON_INGOT: 5
    GOLD_NUGGET: 1
    GOLD_INGOT: 12
    EMERALD: 20
    DIAMOND: 50
    NETHERITE_SCRAP: 100
    AMETHYST_SHARD: 3
    LAPIS_LAZULI: 2
shop:
  title: AziRouge Shop
  trades:
    in-round:
      - id: bread
        material: BREAD
        amount: 4
        price: 12
      - id: cooked_beef
        material: COOKED_BEEF
        amount: 3
        price: 18
      - id: arrows
        material: ARROW
        amount: 16
        price: 20
      - id: torch
        material: TORCH
        amount: 16
        price: 10
