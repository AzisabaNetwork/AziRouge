name: AziRouge
version: '${version}'
main: net.azisaba.aziRouge.AziRouge
description: Roguelike dungeon generator with external schematic templates.
api-version: '1.21'
softdepend:
  - WorldEdit
commands:
  azirouge:
    description: Manage AziRouge dungeon generation and game sessions.
    usage: /azirouge <start|end|session|round|dungeon|money|generate|reload|debug|author>
    permission: azirouge.command
permissions:
  azirouge.command:
    description: Allows using the AziRouge command.
    default: op
  azirouge.start:
    description: Allows creating an AziRouge session with the legacy start command.
    default: op
  azirouge.end:
    description: Allows ending AziRouge sessions.
    default: op
  azirouge.session:
    description: Allows creating, joining, leaving, and listing AziRouge sessions.
    default: op
  azirouge.session.forceend:
    description: Allows force-ending any AziRouge session.
    default: op
  azirouge.money:
    description: Allows viewing and editing AziRouge session money.
    default: op
  azirouge.command.reload:
    description: Allows reloading AziRouge configuration.
    default: op
  azirouge.command.debug:
    description: Allows toggling AziRouge debug logging.
    default: op
  azirouge.command.generate:
    description: Allows generating dungeons.
    default: op
  azirouge.command.author:
    description: Allows editing templates in-game.
    default: op
